---
- name: Keyrings dir exists
  become: yes
  file:
    path: "/etc/apt/keyrings"
    state: directory
    mode: 0755
    owner: root
    group: root

- name: GPG key of grafana is added
  become: yes
  register: grafana_gpg_key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: "/etc/apt/keyrings/grafana.asc"
    mode: 0644
    owner: root
    group: root

- name: Grafana package repository is added
  become: yes
  register: grafana_apt_list
  template:
    src: "grafana.list.jinja2"
    dest: "/etc/apt/sources.list.d/grafana.list"
    mode: 0644
    owner: root
    group: root

- name: apt update if needed
  become: yes
  when: grafana_gpg_key.changed or grafana_apt_list.changed
  apt:
    update_cache: yes

- name: Grafana Alloy is installed
  become: yes
  register: grafana_alloy_installed
  apt:
    pkg:
      - "alloy"
    cache_valid_time: 3600
